<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Welcome to EduGenie 🧠✨</h1>
    <p class="subtitle">Your personal AI tutor for learning support!</p>

    <!-- Q&A -->
    <div class="section">
        <label><strong>Ask EduGenie a Question:</strong></label>
        <div class="input-row">
            <input type="text" id="question" placeholder="Why is the sky blue?" />
            <button type="button" id="qaBtn">Get Answer</button>
        </div>
        <div id="qaResult" class="output"></div>
    </div>

    <!-- Explanation -->
    <div class="section">
        <label><strong>Need an Explanation?</strong></label>
        <div class="input-row">
            <input type="text" id="topic" placeholder="Photosynthesis" />
            <button type="button" id="explainBtn">Explain</button>
        </div>
        <div id="explanationResult" class="output"></div>
    </div>

    <!-- Summarize -->
    <div class="section">
        <label><strong>Summarize a Paragraph:</strong></label>
        <div class="input-row">
            <input type="text" id="summaryText" placeholder="Paste long content to summarize" />
            <button type="button" id="summaryBtn">Summarize</button>
        </div>
        <div id="summaryResult" class="output"></div>
    </div>

    <!-- Quiz -->
    <div class="section">
        <label><strong>Generate a Quiz:</strong></label>
        <div class="input-row">
            <input type="text" id="quizText" placeholder="Solar System" />
            <button type="button" id="quizBtn">Generate Quiz</button>
        </div>
        <div id="quizResult" class="output"></div>
    </div>

    <!-- Learning Recommendations -->
    <div class="section">
        <label><strong>Get Learning Recommendations:</strong></label>
        <div class="input-row">
            <input type="text" id="learnTopic" placeholder="e.g. Linear Regression" />
            <button type="button" id="learnBtn">Get Recommendations</button>
        </div>
        <div id="learnResult" class="output"></div>
    </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
